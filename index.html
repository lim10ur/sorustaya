<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorustaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --gold-dark: #e6c200;
            --dark: #1a1a1a;
            --darker: #111111;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark);
            color: var(--white);
            font-family: 'Nunito', sans-serif;
        }

        /* ─── NAVBAR ─────────────────────────────────── */
        .navbar {
            background-color: var(--gold);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            height: 46px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .navbar-logo {
            width: 30px;
            height: auto;
        }

        .navbar-menu {
            display: flex;
            list-style: none;
            height: 100%;
        }

        .navbar-menu > li {
            position: relative;
            height: 100%;
        }

        .navbar-menu > li > a {
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 16px;
            color: #000;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
            gap: 5px;
        }

        .navbar-menu > li > a:hover {
            background-color: rgba(0,0,0,0.1);
        }

        .arrow {
            font-size: 0.6rem;
            transition: transform 0.2s;
        }

        .navbar-menu > li:hover .arrow {
            transform: rotate(180deg);
        }

        /* Dropdown */
        .dropdown {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #1c1c1c;
            min-width: 190px;
            border-top: 3px solid var(--gold);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            transform: translateY(-6px);
            transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
        }

        .navbar-menu > li:hover .dropdown {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }

        .dropdown a {
            display: block;
            padding: 11px 20px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-family: 'Nunito', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: background-color 0.15s, color 0.15s, padding-left 0.15s;
        }

        .dropdown a:last-child {
            border-bottom: none;
        }

        .dropdown a:hover {
            background-color: var(--gold);
            color: #000;
            padding-left: 26px;
        }

        /* ─── HERO ───────────────────────────────────── */
        .hero {
            text-align: center;
            padding: 50px 20px 50px;
        }

        .hero-title {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
        }

        .hero-logo {
            width: 75px;
            height: auto;
            filter: drop-shadow(0 0 14px rgba(255,215,0,0.35));
        }

        .hero h1 {
            font-family: 'Oswald', sans-serif;
            color: var(--gold);
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
        }

        .hero p {
            color: rgba(255,255,255,0.55);
            font-size: 1rem;
            margin-top: 10px;
            letter-spacing: 2px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .hero-divider {
            width: 60px;
            height: 3px;
            background-color: var(--gold);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* ─── HAKKIMIZDA ─────────────────────────────── */
        .hakkimizda {
            background-image:
                linear-gradient(rgba(0,0,0,0.42), rgba(0,0,0,0.42)),
                url('logohakkimda.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 45px 40px;
            max-width: 620px;
            margin: 0 auto 60px;
        }

        .hakkimizda h2 {
            font-family: 'Oswald', sans-serif;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hakkimizda p {
            color: rgba(255,255,255,0.8);
            line-height: 1.8;
            font-size: 0.98rem;
        }

        .iletisim-butonu {
            display: inline-block;
            margin-top: 28px;
            padding: 13px 32px;
            background-color: var(--gold);
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 900;
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.25s;
            border: 2px solid var(--gold);
        }

        .iletisim-butonu:hover {
            background-color: transparent;
            color: var(--gold);
        }

        /* ─── MOBİL ──────────────────────────────────── */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2.8rem; letter-spacing: 2px; }
            .hero-logo { width: 50px; }
            .hero-title { gap: 14px; }
            .navbar-inner { padding: 0 15px; }
            .navbar-menu > li > a { padding: 0 10px; font-size: 0.78rem; }
            .hakkimizda { margin: 0 15px 50px; padding: 30px 25px; }
        }
    </style>
</head>
<body>

    <!-- ── HAKKIMIZDA ─────────────────────────────────── -->

        <h2>Hakkımızda</h2>
        <p>GELİYO GELİYO ÇOK TAŞŞAKLI Bİ ŞEY GELİYOR :D</p>

</body>
</html>
