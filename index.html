<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sorustaya</title>
    <style>
        .iletisim-butonu {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 30px;
    background-color: #FFD700; /* Altın sarısı */
    color: #000000; /* Siyah yazı */
    text-decoration: none;
    border-radius: 8px; /* Biraz daha yuvarlak */
    font-weight: bold;
    border: 2px solid #000000; /* Siyah kenarlık */
    transition: all 0.3s;
}

.iletisim-butonu:hover {
    background-color: #000000; /* Üstüne gelince siyah */
    color: #FFD700; /* Yazı sarı olsun */
    border: 2px solid #FFD700; /* Kenarlık sarı olsun */
}
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 15%;
        }.hakkimizda 
        {
            margin: 30px auto; /* Yukarıdan boşluk bırakır, kendini ortalar */
            padding: 20px; /* Yazının kutu kenarlarına değmemesini sağlar */
            background-color: #2a2a2a; /* Koyu gri bir kutu */
            border-radius: 15px; /* Köşeleri yumuşatır */
            width: 80%; /* Ekranın sadece %80'ini kaplar */
            max-width: 600px; /* Çok da fazla büyümesini engeller */
            border: 1px solid #444; /* Etrafına ince bir çerçeve */
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Sorustaya Logo" style="width: 150px; height: auto; margin-bottom: 10px;">
    <h1>SORUSTAYA</h1>
    <p>İşi ustasına sor. Çok yakında burada...</p>
    <div class="hakkimizda">
    <h2>Hakkımızda</h2>
    <p>GELİYO GELİYO ÇOK TAŞŞŞAKLI Bİ ŞEY GELİYOR :D</p>
</div>
</body>
</html>
