<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sorustaya</title>
    <style>
        body {
        background-color: #1a1a1a;
        color: #ffffff;
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 15%;
    }

    /* 2. Hakkımızda kutusunun ayarları */
    .hakkimizda {
        margin: 30px auto;
        padding: 20px;
        background-color: #2a2a2a;
        border-radius: 15px;
        width: 80%;
        max-width: 600px;
        border: 1px solid #444;
    }

    /* 3. İletişim butonunun ayarları */
    .iletisim-butonu {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 30px;
        background-color: #FFD700; /* Sarı */
        color: #000000; /* Siyah yazı */
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        border: 2px solid #000000;
        transition: all 0.3s;
    }

    .iletisim-butonu:hover {
        background-color: #000000;
        color: #FFD700;
        border: 2px solid #FFD700;
    }
    </style>
</head>
<body>
    <img src="logo.png" alt="Sorustaya Logo" style="width: 150px; height: auto; margin-bottom: 10px;">
    <h1>SORUSTAYA</h1>
    <p>İşi ustasına sor. Çok yakında burada...</p>
    <div class="hakkimizda">
    <h2>Hakkımızda</h2>
    <p>GELİYO GELİYO ÇOK TAŞŞŞAKLI Bİ ŞEY GELİYOR :D</p>
</div>
</body>
</html>
