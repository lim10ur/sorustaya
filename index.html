<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorustaya</title>
    <style>
        
        body {
        background-color: #1a1a1a;
        color: #fff;
        text-align: center;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 50px 20px;
    }

    h1 { color: #FFD700; }
    h2 { color: #FFD700; }

    .hakkimizda {
        /* Buradaki linear-gradient resmin üzerine hafif siyahlık atar, yazıyı okutur */
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('logohakkimda.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        
        /* Kutu Ayarları */
        border: 3px solid #FFD700;
        border-radius: 15px;
        padding: 40px;
        max-width: 600px;
        margin: 40px auto;
    }

    .iletisim-butonu {
        display: inline-block;
        margin-top: 25px;
        padding: 15px 30px;
        background-color: #FFD700;
        color: #000;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s;
        border: 2px solid #FFD700;
    }

    .iletisim-butonu:hover {
        background-color: #000;
        color: #FFD700;
        border: 2px solid #FFD700;
    }
    </style>
</head>
<body>

    <img src="logo.png" alt="Sorustaya Logo" style="width: 150px; height: auto;">

    <h1>SORUSTAYA</h1>
    <p>İşi ustasına sor. Çok yakında burada...</p>

    <div class="hakkimizda">
        
        <h2>Hakkımızda</h2>
        <p>GELİYO GELİYO ÇOK TAŞŞAKLI Bİ ŞEY GELİYOR :D</p>
        
        <a href="mailto:senin-mailin@gmail.com" class="iletisim-butonu">Bize Ulaşın</a>
    </div>

</body>
</html>
